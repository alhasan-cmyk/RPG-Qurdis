<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lembah Kenanga — Main</title>
  <!-- Dipasang ke Layar Utama: terbuka tanpa bilah alamat. Ini satu-satunya
       cara layar penuh di iPhone, tempat Safari tidak punya requestFullscreen. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lembah Ilmu">
  <link rel="apple-touch-icon" href="assets/homepage/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: "VT323", monospace; color: #f5e6c8; }
    canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; display: block; touch-action: none; }
    #loading { position: absolute; font-size: 24px; letter-spacing: 1px; z-index: 20; }
    #home { z-index: 60; }
    /* Layar tegak: permainan dipaksa mendatar (src/ui/landscape.js).
       Kanvas diputar 90° dan petunjuk "putar ponsel" muncul di atasnya. */
    html.lk-landscape-putar body { display: block; overflow: hidden; }
    html.lk-landscape-putar #loading { max-width: 80vw; text-align: center; }
    #home { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #d9c39a; text-decoration: none; opacity: .6; }
    #home:hover { opacity: 1; }
    /* font warm-up so canvas measureText sees the loaded faces */
    .warm { position: absolute; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <span class="warm" style="font-family:'Press Start 2P'">.</span><span class="warm" style="font-family:'VT323'">.</span>
  <div id="loading">Memuat…</div>
  <canvas id="game" tabindex="0"></canvas>
  <a id="home" href="index.html">← Homepage</a>

  <!-- Gerbang akun. Dijalankan SEBELUM src/main.js dimuat, jadi murid yang
       membuka alamat ini langsung tidak pernah masuk sebagai "Petani" tanpa
       akun. Tanpa akun, nilai ujiannya nanti ditolak server ("Murid belum
       terdaftar di peramban ini") dan murid tidak tahu sebabnya.

       Aturannya: harus ada identitas murid di peramban ini — nama di profil
       ATAU data murid dari pendaftaran. Kalau tidak ada, kembalikan ke halaman
       pendaftaran dan bawa alamat asal supaya pesannya bisa menjelaskan. -->
  <script>
    (function () {
      var punyaProfil = false;
      var punyaMurid = false;
      try {
        var p = JSON.parse(localStorage.getItem('lk_profile') || 'null');
        punyaProfil = !!(p && p.name);
      } catch (e) { /* localStorage rusak: anggap belum punya akun */ }
      try {
        var m = JSON.parse(localStorage.getItem('lk_murid') || 'null');
        punyaMurid = !!(m && m.nama);
      } catch (e) { /* idem */ }

      if (punyaProfil || punyaMurid) return;   // sudah terdaftar: main seperti biasa

      // Belum punya akun. Kembali ke halaman depan dengan penanda, bukan
      // langsung menampilkan kanvas tanpa identitas.
      location.replace('index.html?perluakun=1');
    })();
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
